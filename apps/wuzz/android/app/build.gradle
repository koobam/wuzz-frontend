apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Reads app/google-services.json (git-ignored; CI writes it from a secret).
apply plugin: "com.google.gms.google-services"

// react-native-config: env file per flavor → project.env.get("KEY") in Gradle
project.ext.envConfigFiles = [
    local: ".env",
    staging: ".env.staging",
    production: ".env.production",
]
// dotenv reads from project.rootDir/../ (= android/); copy from repo root so it finds the file
def envFlavor = gradle.startParameter.taskNames.findResult { name ->
    def m = (name =~ /(?:.*:)*[a-z]+([A-Z][A-Za-z0-9]+)/); m.find() ? m.group(1).toLowerCase() : null
} ?: ""
def envFileName = project.ext.envConfigFiles.findResult { k, v -> envFlavor.startsWith(k.toLowerCase()) ? v : null } ?: ".env"
def envSrc = file("${rootProject.projectDir}/../${envFileName}")
def envDest = file("${rootProject.projectDir}/${envFileName}")
if (envSrc.exists() && envDest.canonicalPath != envSrc.canonicalPath) {
    envDest.parentFile.mkdirs(); envDest.text = envSrc.text
}
apply from: "${rootProject.projectDir}/../node_modules/react-native-config/android/dotenv.gradle"

// Release signing: keystore.properties is gitignored (not committed). Falls back to the
// debug keystore when absent so a fresh clone still builds (just not release-signable).
def keystorePropertiesFile = file("${rootProject.projectDir}/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    debuggableVariants = ["localDebug", "stagingDebug", "productionDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

android {
    sourceSets {
        main {
            // NOTE: 4 levels up from android/app/ to reach the monorepo root's packages/
            // (not 2 — apps/wuzz has no packages/ dir of its own).
            java.srcDirs += ["../../../../packages/wuzz-nitro-text/nitrogen/generated/android/kotlin"]
            java.srcDirs += ["../../../../packages/wuzz-shimmer/android"]
            java.srcDirs += ["../../../../packages/wuzz-shimmer/nitrogen/generated/android/kotlin"]
        }
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.wuzz"
    defaultConfig {
        applicationId "com.koobam.wuzz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName project.env.get("APP_VERSION") ?: "1.0"
        resValue "string", "build_config_package", "com.wuzz"
        // react-native-maps (Google Maps SDK for Android) — read by AndroidManifest.xml
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: project.env.get("GOOGLE_MAPS_API_KEY") ?: "", APP_URL_SCHEME: project.env.get("APP_URL_SCHEME") ?: "wuzz"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // No keystore.properties yet — fall back to the debug keystore so the
                // project still builds. Run `keytool -genkeypair` and add
                // android/keystore.properties before shipping a real release build.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    flavorDimensions += "env"
    productFlavors {
        local {
            dimension = "env"
            applicationIdSuffix = project.env.get("ANDROID_APPLICATION_ID_SUFFIX") ?: ".dev"
            resValue "string", "app_name", project.env.get("APP_DISPLAY_NAME") ?: "Wuzz (Dev)"
            // Local is dev-only — release variant (if ever built) stays on the debug keystore.
            signingConfig signingConfigs.debug
        }
        staging {
            dimension = "env"
            applicationIdSuffix = project.env.get("ANDROID_APPLICATION_ID_SUFFIX") ?: ".staging"
            resValue "string", "app_name", project.env.get("APP_DISPLAY_NAME") ?: "Wuzz (Staging)"
            // Staging is internal testing: signed with the release keystore when
            // keystore.properties is present (CI), the debug one otherwise.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        production {
            dimension = "env"
            applicationIdSuffix = project.env.get("ANDROID_APPLICATION_ID_SUFFIX") ?: ""
            resValue "string", "app_name", project.env.get("APP_DISPLAY_NAME") ?: "Wuzz"
            signingConfig signingConfigs.release
        }
    }
    buildTypes {
        debug {
            // Explicit here so it always wins over the flavor's signingConfig above —
            // every *Debug variant (local/staging/production) uses the debug keystore.
            signingConfig signingConfigs.debug
        }
        release {
            // No signingConfig here on purpose: each flavor's own signingConfig (above)
            // decides — production gets the real release keystore, local/staging don't.
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
