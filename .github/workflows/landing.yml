name: Deploy landing

# Builds apps/landing and uploads it to the Cloudflare Pages project wuzz-landing, which serves
# https://wuzz.care. By hand only, so the public page never changes by accident.
#
# One-time Cloudflare setup (dashboard, not code):
#   1. Workers & Pages > Create > Pages > Direct upload, project name "wuzz-landing", production branch "main".
#   2. That project > Custom domains > add wuzz.care (and www.wuzz.care). Cloudflare creates the DNS records
#      when the zone is on the same account.
# Repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Are the Cloudflare secrets set?
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wuzz/landing build
        env:
          VITE_API_URL: https://api.wuzz.care
      - run: npx --yes wrangler@4 pages deploy apps/landing/dist --project-name wuzz-landing --branch main --commit-dirty=true
